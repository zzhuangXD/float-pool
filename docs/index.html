<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f3ed" />
    <meta name="description" content="一个可以摸到夏天的 3D 充气泳池。拨动水面，拖一只小鸭，看涟漪慢慢荡开。" />
    <title>Float · 浮日泳池</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script type="module" crossorigin src="./assets/index-CxeCdgAD.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-zrTauP-T.css">
  </head>
  <body>
    <div id="app">
      <header class="header">
        <a class="brand" href="./" aria-label="Float 浮日泳池首页"><svg viewBox="0 0 38 38" aria-hidden="true"><ellipse cx="19" cy="21" rx="16" ry="8"/><ellipse cx="19" cy="17" rx="11" ry="5.5"/><path d="M15 10c-3-4 7-4 5-8"/></svg><span>float<span class="brand-dot">.</span></span></a>
        <span class="header-note">给自己，一小会儿放空。</span>
        <div class="header-actions">
          <button id="sound" class="icon-label" aria-label="开启水声" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m11 5-6 4H2v6h3l6 4V5Z"/><path id="sound-path" d="m16 9 5 6m0-6-5 6"/></svg><span>水声关</span></button>
          <a class="github-link" href="https://github.com/zzhuangXD/float-pool" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 查看源码"><svg viewBox="0 0 24 24"><path d="M9 19c-5 1-5-2-7-2m14 5v-4c0-1-.4-2-1-2.5 3-.3 6-1.5 6-6A4.7 4.7 0 0 0 20 6c.3-1.1.3-2.2-.1-3.3 0 0-1.2-.4-4 1.3a13.8 13.8 0 0 0-7 0C6 2.3 4.8 2.7 4.8 2.7 4.4 3.8 4.4 4.9 4.7 6a4.7 4.7 0 0 0-1.3 3.5c0 4.5 3 5.7 6 6-.5.5-.8 1.2-.8 2.5v4"/></svg></a>
        </div>
      </header>

      <main>
        <div id="scene" aria-label="可交互的三维充气泳池"></div>
        <section class="intro">
          <div class="eyebrow"><span class="sun">☼</span> 私人夏日 · 随时开放</div>
          <h1>什么都不想。<br />只想<span class="water-word">玩水<svg viewBox="0 0 140 13"><path d="M2 8Q19 0 36 8T70 8T104 8T138 8"/></svg></span>。</h1>
          <p>把小鸭推远一点，<br />让烦恼跟着涟漪漂走。</p>
          <button id="wave" class="wave-button"><svg viewBox="0 0 24 24"><path d="M2 12c3-7 7 7 10 0s7 7 10 0M2 18c3-7 7 7 10 0s7 7 10 0"/></svg><span>掀起一点浪花</span><span class="button-arrow">↗</span></button>
          <div class="weather"><span class="live-dot"></span><span id="mood">微风，适合发呆</span></div>
        </section>

        <div class="scene-label" aria-hidden="true"><span>SUMMER, ON REPEAT</span><div>28° <span>永远晴天</span></div></div>

        <div class="scene-tools" aria-label="场景工具">
          <button id="view" title="切换俯视视角" aria-label="切换俯视视角"><svg viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5-9-5Zm0 5 9 5 9-5M3 18l9 5 9-5"/></svg></button>
          <button id="settings-toggle" title="调节风浪" aria-label="调节风浪" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h9m4 0h3M4 17h3m4 0h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></svg></button>
          <button id="reset" title="重新摆放" aria-label="重新摆放"><svg viewBox="0 0 24 24"><path d="M3 10a9 9 0 1 1 2 8M3 4v6h6"/></svg></button>
        </div>

        <section id="settings" class="settings-panel" hidden aria-label="风浪设置">
          <div><strong>今天的风浪</strong><span id="wind-value">微风</span></div>
          <input id="wind" type="range" min="0" max="100" value="25" aria-label="风浪强度" />
          <div class="range-labels"><span>风平浪静</span><span>有点闹腾</span></div>
        </section>

        <section class="toy-dock" aria-label="添加漂浮物">
          <div class="dock-heading"><span>再放点什么？</span><span><span id="toy-count">7</span> 件漂浮物</span></div>
          <div class="toy-list">
            <button data-toy="duck" aria-label="添加橡胶小鸭"><span class="toy-picture" id="thumb-duck">🦆</span><span>小黄鸭</span></button>
            <button data-toy="ring" aria-label="添加游泳圈"><span class="toy-picture" id="thumb-ring">🛟</span><span>游泳圈</span></button>
            <button data-toy="ball" aria-label="添加充气球"><span class="toy-picture" id="thumb-ball">🏐</span><span>充气球</span></button>
            <button data-toy="board" aria-label="添加桨板"><span class="toy-picture" id="thumb-board">🏄</span><span>桨板</span></button>
            <button data-toy="flamingo" aria-label="添加火烈鸟浮圈"><span class="toy-picture" id="thumb-flamingo">🦩</span><span>火烈鸟</span></button>
          </div>
        </section>

        <div id="loading" class="loading"><span class="loading-rings"></span><span>正在放满一池夏天…</span></div>
        <div id="toast" role="status" aria-live="polite"></div>
      </main>

      <footer class="footer"><span class="footer-name">FLOATING IS A WAY OF LIFE.</span><span class="desktop-help">轻点拨水 <i>·</i> 拖动物件 <i>·</i> 按住下压 <i>·</i> 右键转动视角</span><span class="mobile-help">轻点拨水 · 拖动物件 · 按住下压 · 双指转动</span><span class="footer-number">VOL. 001 / 浮日</span></footer>
    </div>
  </body>
</html>
